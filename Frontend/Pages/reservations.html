<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWOS - Perfil</title>
    <link rel="stylesheet" href="../../Frontend/Styles/profile.css">
    <link rel="icon" type="image/png" href="../../Frontend/Images/LogoPage.jpg" />
    <script src="../../Backend/auth.js"></script>
    <script src="../../Backend/flights.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="design">

    <div class="header">

        <div class="header-content">

            <div class="back-button-container">
                <a href="../../Frontend/Pages/search.html" class="back-btn" data-testid="back-button">Regresar</a>
            </div>

        </div>

    </div>

    <div class="content">

        <div class="sidebar">

            <div class="profile-card">

                <div class="profile-info">
                    <label>Nombre:</label>
                    <span id="userNombres" class="info-value">Cargando...</span>
                </div>

                <div class="profile-info">
                    <label>Username:</label>
                    <span id="userUsername" class="info-value">Cargando...</span>
                </div>

                <div class="profile-info">
                    <label>Correo</label>
                    <span id="userCorreo" class="info-value">Cargando...</span>
                </div>

            </div>

            <button id="btnChangePassword" class="buttons">
                Cambiar psw
            </button>

            <button id="btnLogout" class="buttons">
                Cerrar cuenta
            </button>

            <button class="buttons" id="btnDeleteAccount">
                Eliminar cuenta
            </button>

        </div>

        <div class="main-content">

            <h1 class="page-title">Tus pedidos</h1>

            <!-- Sección cuando NO hay vuelos registrados ahora son pedidos juasjuas que reciclador soy -->
            <div class="no-flights" data-testid="no-flights-section" style="display: none;">
                <div class="no-flights-placeholder">
                    <img src="../../Frontend/Images/NoInformation.png" alt="No tienes vuelos agendados" class="no-flights-image">
                </div>
            </div>

            <!-- Sección cuando SÍ hay vuelos registrados pedidos juasjuas -->
            <div class="flights-table-container" style="display: none;">
                <!-- Las reservas se cargarán dinámicamente aquí pedidos -->
            </div>

        </div>

    </div>

    <script>
        // Inicializar la página de reservaciones
        window.addEventListener('DOMContentLoaded', function() {
            initReservationsPageAuth(); // Cargar datos de usuario y botones
            initReservationsPage();     // Cargar reservas
        });
    </script>

</body>

</html>
