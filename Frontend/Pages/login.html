<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Asignamos un titulo para esta pagina-->
    <title>Login</title>
    <!-- Icono para WEB -->
    <link rel="icon" type="image/png" href="../../Frontend/Images/LogoPage.jpg" />
    <!--Ponemos estilos externos-->
    <link rel="stylesheet" href="../../Frontend/Styles/style.css">
    <script src="../../Backend/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
 
    <main class="signup-container">
        <div class="signup-header ">
            <h1>Inicio de sesion</h1>
        </div>

        <form id="loginForm" class="form-content" onsubmit="handleLogin(event); return false;">
            <div class="input-group">
                <label for="usuario">Ingrese su usuario</label>
                <input 
                    class ="inputs" 
                    type="text" 
                    name="usuario" 
                    placeholder="Usuario">

                <label for="pwd">Contraseña</label>
                <input 
                    class ="inputs" 
                    type="password" 
                    name="pwd" 
                    placeholder="Contraseña">
            </div>

            <button class="botones crear" type="submit" href="../../Frontend/Pages/empleadosadmin.html">Ingresar</button>

            <p class="login-link">
                No tienes cuenta?, 
                <a href="../../Frontend/Pages/register.html" class = "links">pulsa aqui para crear una</a>

                 <p class="login-link">
                    Eres un usuario administrativo?, 
                <a href="../../Frontend/Pages/empleados.html" class = "links">Haz click aqui para ingresar desde el sitio de admins.</a>
            </p>
        </form>
    </main>
</body>
</html>
