<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWOS - Home</title>
    <link rel="stylesheet" href="../../Frontend/Styles/main.css">
    <link rel="icon" type="image/png" href="../../Frontend/Images/LogoPage.jpg" />
    <script src="../../Backend/auth.js"></script>
    <script src="../../Backend/flights.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="design">

    <div class="header">

        <div class="header-content">

            <div class="logo">

                <img src="../../Frontend/Images/Logo.jpg" alt="AWOS Logo" class="logo-image">

            </div>

            <div class="profile">
                <a href="../../Frontend/pages/reservations.html">
                    <img src="../../Frontend/Images/User_profile.jpeg" alt="Perfil" class="profile-image">
                </a>
            </div>


        </div>

    </div>

    <div class="content">

        <div class="menu-container">

            <div class="menu-fields">

                <div class="field-box">

                    <div class="field">

                        <label>Instrumento</label>

                        <select id="origen">
                            <option value="">Instrumento</option>
                        </select>

                    </div>

                    <div class="field">

                        <label>Marca</label>

                        <select id="destino">
                            <option value="">Marca</option>
                        </select>

                    </div>

                </div>

                <div class="field">

                    <label>Precio</label>

                    <select id="fecha_salida">
                        <option value="">Selecciona precio</option>
                    </select>

                </div>

                <div class="field">

                    <label>Rating</label>

                    <select id="fecha_regreso">
                          <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>

                </div>

                <div class="field">

                    <label>Cantidad</label>

                    <select id="num_boletos" data-testid="tickets-select">

                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>

                    </select>

                </div>

                <button id="btnBuscar" class="btn">
                    Buscar
                </button>

            </div>



        </div>

        <section class="sugges">

            <h2 class="title">Te sugerimos estos instrumentos</h2>

            <p class="subtitle">Los mejores instrumentos</p>

            <div class="sugges-container">

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Guitarra_Electronica.jpg" alt="Guitarra">

                    </div>

                    <div class="card-info">

                        <h3>Guitarra</h3>

                        <p>Descripcion</p>


                    </div>

                </div>

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Trompeta.webp" alt="Sonido">

                    </div>

                    <div class="card-info">

                        <h3>Trompeta</h3>

                        <p>Tututu</p>

                    </div>

                </div>

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Piano_Yamaha.jpg" alt="Piano">

                    </div>

                    <div class="card-info">

                        <h3>Piano</h3>

                        <p>Vuelos internacionales directos a la capital china</p>

                    </div>

                </div>

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Triangulo.jpg" alt="Triangulo">

                    </div>

                    <div class="card-info">

                        <h3>Triangulo</h3>

                        <p>Ping</p>

                    </div>

                </div>

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Bateria_Electronica.webp" alt="Bateria">

                    </div>

                    <div class="card-info">

                        <h3>Bateria Electronica</h3>

                        <p>Tum tum</p>

                    </div>

                </div>

                <div class="card">

                    <div class="card-image">

                        <img src="../../Frontend/Images/countries/Clash_Royale.avif" alt="Paris">

                    </div>

                    <div class="card-info">

                        <h3></h3>

                        <p>Accesible con vuelos directos al aeropuerto Charles de Gaulle</p>

                    </div>

                </div>



                     

        </section>

    <script>
        // Inicializar la página de búsqueda
        window.addEventListener('DOMContentLoaded', initSearchPage);
    </script>

</body>

</html>
