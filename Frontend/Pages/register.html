<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <link rel="icon" type="image/png" href="../../Frontend/Images/LogoPage.jpg" />

    <link rel="stylesheet" href="../../Frontend/Styles/style.css" />
    <script src="../../Backend/auth.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  </head>

  <body>
    <div class="signup-container">
      <div class="signup-header">
        <h1>Creación de Cuenta</h1>
        <p>Regístrate para comenzar a seleccionar vuelos.</p>
      </div>

      <form id="registerForm" class="form-content" onsubmit="handleRegister(event); return false;">
        <div class="input-group">
          <label for="nombres">Nombres</label>
          <input
            id="nombres"
            class="inputs"
            name="nombres"
            type="text"
            placeholder="Tus nombres"
            required/>

          <label for="username">Nombre de usuario</label>
          <input
            id="username"
            class="inputs"
            name="username"
            type="text"
            placeholder="Usa tu creatividad"
            required/>

          <label for="correo">Correo Electrónico</label>
          <input
            id="correo"
            class="inputs"
            name="correo"
            type="email"
            placeholder="x@dominio.com"
            required/>

          <label for="pwd">Contraseña</label>
          <input
            id="clave"
            class="inputs"
            type="password"
            name="pwd"
            placeholder="No olvidar"
            required/>

          <label for="confirmar_clave">Confirmar Contraseña</label>
          <input
            id="confirmar_clave"
            class="inputs"
            type="password"
            name="pwd_confirm"
            placeholder="Confirmar"
            name="confirmar_pwd"
            required/>
        </div>

        <button class="botones crear" type="submit">Crear cuenta</button>

        <p class="login-link">
          ¿Ya tienes cuenta? <a href="../../Frontend/Pages/login.html" class="links">Inicia sesión</a>
        </p>
      </form>
    </div>

  </body>
</html>
